name: interop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Each implementation's own tests run in their own job, printing every test.
# The interop job then runs the cross-implementation harness: conformance checks
# are collapsible groups, and every producer → resolver interop run is printed
# as a visible line. The matrix is posted to the run's summary page.
jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/typescript
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: node --test --test-reporter=spec test/*.test.ts

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test -- --show-output

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/python
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Lint
        run: uv run ruff check && uv run ruff format --check
      - name: Typecheck
        run: uv run mypy
      - name: Unit tests
        run: uv run pytest -v

  elixir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/elixir
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - run: mix deps.get
      - name: Format
        run: mix format --check-formatted
      - name: Compile
        run: mix compile --warnings-as-errors
      - name: Unit tests
        run: mix test --trace

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -v ./...

  swift:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/swift
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test

  kotlin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/kotlin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Unit tests
        run: ./gradlew test

  zig:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/zig
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Format
        run: zig fmt --check .
      - name: Unit tests
        run: zig build test --summary all

  common-lisp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/common-lisp
    steps:
      - uses: actions/checkout@v5
      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl
      - name: Build
        run: sh scripts/build.sh
      - name: Library tests
        run: sh scripts/test.sh

  forth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/forth
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Gforth and native support libraries
        run: sudo apt-get update && sudo apt-get install -y gforth libtool-bin g++ libsodium-dev libutf8proc-dev nlohmann-json3-dev
      - name: Build native support library
        run: sh build.sh
      - name: Library and driver tests
        run: |
          sh run.sh test.fs
          node --test driver.test.mjs

  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install native libraries
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libjson-c-dev
      - name: Conformance and cross-resolution
        run: node harness/run.ts --impl c --impl typescript --list
      - name: Driver boundary tests
        run: VH_TEST_IMPLS=c node --test harness/driver-regressions.test.ts

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install native libraries
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev nlohmann-json3-dev
      - name: Conformance and cross-resolution
        run: node harness/run.ts --impl cpp --impl typescript --list
      - name: Driver boundary tests
        run: VH_TEST_IMPLS=cpp node --test harness/driver-regressions.test.ts

  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore locked dependencies
        run: dotnet restore implementations/csharp/VHLog.csproj --locked-mode
      - name: Conformance and cross-resolution
        run: node harness/run.ts --impl csharp --impl typescript --list
      - name: Driver boundary tests
        run: VH_TEST_IMPLS=csharp node --test harness/driver-regressions.test.ts

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Conformance and cross-resolution
        run: node harness/run.ts --impl java --impl typescript --list
      - name: Driver boundary tests
        run: VH_TEST_IMPLS=java node --test harness/driver-regressions.test.ts

  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Conformance and cross-resolution
        run: node harness/run.ts --impl ruby --impl typescript --list
      - name: Driver boundary tests
        run: VH_TEST_IMPLS=ruby node --test harness/driver-regressions.test.ts

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, mbstring
          coverage: none
      - name: Conformance and cross-resolution
        run: node harness/run.ts --impl php --impl typescript --list
      - name: Driver boundary tests
        run: VH_TEST_IMPLS=php node --test harness/driver-regressions.test.ts

  interop:
    needs: [typescript, rust, python, elixir, go, swift, kotlin, zig, common-lisp, forth, c, cpp, csharp, java, ruby, php]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl

      - name: Install Gforth and native support libraries
        run: sudo apt-get update && sudo apt-get install -y gforth libtool-bin g++ libsodium-dev libutf8proc-dev nlohmann-json3-dev

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, mbstring
          coverage: none
      - name: Install C JSON library
        run: sudo apt-get update && sudo apt-get install -y libjson-c-dev
      - name: Restore locked .NET dependencies
        run: dotnet restore implementations/csharp/VHLog.csproj --locked-mode

      - name: Vectors are up to date
        run: |
          node tools/generate-vectors.ts
          git diff --exit-code vectors/

      - name: Interoperability tests
        run: node harness/run.ts --list --markdown "$GITHUB_STEP_SUMMARY"

      - name: README matrix is up to date
        run: |
          node harness/run.ts --update-readme > /dev/null
          git diff --exit-code README.md || (echo "::error::README interop matrix is stale; run node harness/run.ts --update-readme" && exit 1)
