<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vh: C, the drill cores</title>
<style>
@font-face { font-family: "Martian Mono"; src: url(https://cdn.jsdelivr.net/fontsource/fonts/martian-mono:vf@latest/latin-wght-normal.woff2) format("woff2"); font-weight: 100 800; font-display: swap; }
:root { color-scheme: dark; --ground: oklch(23% 0.015 230); --ink: oklch(94% 0.01 230); --ink-2: oklch(74% 0.02 230); --accent: oklch(78% 0.12 190); }
* { box-sizing: border-box; margin: 0; }
body { background: var(--ground); color: var(--ink); font: 400 15px/1.6 "Martian Mono", ui-monospace, Menlo, Consolas, monospace; }
main { display: grid; grid-template-columns: minmax(0, 26rem) 1fr; gap: 56px; padding: 56px; min-height: 100svh; align-items: center; }
h1 { font-size: clamp(2rem, 1rem + 3vw, 3.4rem); font-weight: 700; line-height: 1.05; letter-spacing: -0.04em; font-stretch: 112%; }
p { color: var(--ink-2); margin-top: 20px; max-width: 40ch; }
a { color: var(--accent); }
.tray { display: grid; grid-template-columns: repeat(8, 1fr); gap: 14px; align-items: end; }
.core { display: flex; flex-direction: column; gap: 3px; }
.core b { font-size: 12px; font-weight: 500; color: var(--ink-2); margin-top: 10px; writing-mode: vertical-rl; transform: rotate(180deg); align-self: center; }
.band { height: var(--h); border-radius: 2px; background: var(--c); transform-origin: bottom; }
.band:nth-child(1) { --c: oklch(62% 0.06 60); --h: 70px; } .band:nth-child(2) { --c: oklch(52% 0.05 40); --h: 42px; }
.band:nth-child(3) { --c: oklch(70% 0.04 90); --h: 96px; } .band:nth-child(4) { --c: oklch(45% 0.04 230); --h: 30px; }
.band:nth-child(5) { --c: oklch(78% 0.12 190); --h: 58px; }
@media (prefers-reduced-motion: no-preference) {
  .band { animation: settle 1.1s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 140ms + var(--d) * 60ms); }
  @keyframes settle { from { transform: scaleY(.0); opacity: 0; } }
}
.legend { margin-top: 24px; font-size: 12px; color: var(--ink-2); grid-column: 2; }
@media (max-width: 760px) { main { grid-template-columns: 1fr; padding: 28px 18px; gap: 32px; } .tray { gap: 6px; } .legend { grid-column: 1; } }
</style>
</head>
<body>
<main>
  <div>
    <h1>vh: eight cores, the same strata</h1>
    <p>VH-Log, the hash-chained history under did:vh, built eight times. Drill any of them and the layers line up: the same SCID, the same entry hashes, the same signatures.</p>
    <p><a href="#">Compare the layers</a></p>
  </div>
  <div>
    <div class="tray" id="tray"></div>
    <p class="legend">Five entries of <code>minimal</code> generation scenario, from QmfZEwVd…Fg7 at the bottom.</p>
  </div>
</main>
<script>
const L = ["typescript", "rust", "python", "elixir", "go", "swift", "kotlin", "zig"];
document.getElementById("tray").innerHTML = L.map((l, i) => `<div class="core">${[4,3,2,1,0].map(d => `<span class="band" style="--i:${i};--d:${d}"></span>`).join("")}<b>${l}</b></div>`).join("");
</script>
</body>
</html>
