[package]
name = "vh-log"
version = "0.1.0"
edition = "2024"
description = "VH-Log (Verifiable History Log) for the vh-log-interop-0 profile"
license = "MIT"
publish = false

[lib]
name = "vh_log"

[dependencies]
ed25519-dalek = "3.0.0"
ryu-js = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.11.0"
